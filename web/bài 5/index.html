<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Định dạng văn bản</title>
    <style>
        body {padding: 10px;}
        .label { font-weight: bold; text-decoration: underline; }
        .desc {font-style: italic}
    </style>
</head>
<body>
    <h1 style="color: #006633; text-align: center;">Định dạng văn bản</h1>
    <p>
        <span class="label">Hóa học: </span>
        <span class="desc">Nước: </span>
        <span style="color: red">H<sub>2</sub>O</span>;
        <span class="desc">Acid Sulfuric: </span>
        <span style="color: red">H<sub>2</sub>SO<sub>4</sub></span>
    </p>
    <p>
        <span class="label">Toán học: </span>
        <span class="desc">Phương trình bậc 2: </span>
        <span style="color: red">ax<sup>2</sup> + bx + c = 0</span>
    </p>
    <p>
        <span class="label">Tin học: </span>
        <span class="desc">Vòng lặp For:</span>
        <div style="color: #0000CC; background-color: #CCCCCC; text-align: center; font-family: monospace">
            <pre>For i = 0 To 10
                Tong = Tong + 1
Next
        </pre>
        </div>
    </p>
</body>
</html>
